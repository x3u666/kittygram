server {
  listen 80;
  root /static;
  absolute_redirect off;
  client_max_body_size 10m;

  location = / { return 302 /kittygram/; }
  location = /kittygram { return 301 /kittygram/; }
  location = /taski { return 301 /taski/; }

  location /kittygram/static/ {
    try_files $uri =404;
  }

  location /kittygram/ {
    try_files $uri /kittygram/index.html =404;
  }

  location /taski/ {
    root /usr/share/nginx/html;
    index index.html;
  }

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000;
  }

  location /static/ {
    alias /static/backend/;
  }

  location /media/ {
    alias /media/;
  }
}
